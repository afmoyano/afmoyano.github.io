<!-- Enlaces bilingües para motores de búsqueda (Google) -->
<link rel="alternate" hreflang="es" href="https://afmoyano.github.io/" />
<link rel="alternate" hreflang="en" href="https://afmoyano.github.io/en" />
<link rel="alternate" hreflang="x-default" href="https://afmoyano.github.io/" />

<!-- Metaetiqueta de idioma dinámico -->
{% if page.url == "/en" or page.url == "/en.html" %}
  <meta http-equiv="content-language" content="en" />
{% else %}
  <meta http-equiv="content-language" content="es" />
{% endif %}

<!-- Open Graph para vistas previas en redes sociales -->
<meta property="og:title" content="{{ page.title | replace: '|', '-' }}" />
{% if page.description %}
<meta property="og:description" content="{{ page.description }}" />
{% endif %}
<meta property="og:type" content="profile" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="Alejandro Federico Moyano" />
<meta property="og:image" content="{{ "/foto-alejandro-moyano.jpg" | absolute_url }}" />
<meta name="google-site-verification" content="G0D7NRW2oq3DJHxorLVXqeM9Cpt4ZNM_0Zvd25qlFzI" />

<!-- Estilos optimizados para exportación a PDF (Ctrl + P) -->
<style>
@media print {
  /* Oculta elementos secundarios del tema Jekyll */
  .downloads,
  footer,
  header p,
  header ul {
    display: none !important;
  }

  /* Mantiene visible únicamente la cabecera del nombre */
  header {
    display: block !important;
    position: static !important;
    width: 100% !important;
    margin-bottom: 12px !important;
    padding: 0 !important;
  }

  /* Formato para el nombre principal al imprimir */
  header h1 {
    margin: 0 0 6px 0 !important;
    font-size: 22pt !important;
    line-height: 1.1 !important;
  }

  header h1 a {
    color: #000 !important;
    text-decoration: none !important;
    font-weight: bold !important;
  }

  /* Oculta los enlaces de conmutación de idioma en el documento PDF */
  p:first-of-type:has(a[href*="afmoyano.github.io"]),
  p:first-of-type:contains("Español"),
  p:first-of-type:contains("English") {
    display: none !important;
  }

  /* Configuración general de página A4 */
  body {
    font-size: 10pt;
    line-height: 1.35;
    color: #000 !important;
    background: #fff !important;
    margin: 0;
    padding: 0;
  }

  section, .wrapper, main {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    float: none !important;
  }

  /* Evita cortes incómodos de página en las experiencias */
  h2, h3, h4, ul {
    page-break-inside: avoid;
  }

  a {
    color: #000 !important;
    text-decoration: none !important;
  }
}
</style>
